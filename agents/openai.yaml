interface:
  display_name: "KISS-Chris-Stack"
  short_description: "Gather context and orchestrate separate TDD agents."
  default_prompt: "Use $kiss-chris-stack to inspect documentation and code, resolve grill-me (default true), run $grilling before each new goal when enabled or explicitly requested, otherwise skip automatic Grilling, and continue without a closing confirmation, define the goal, honor configured plan-mode approval, and orchestrate separate test, implementation, and evaluation agents."
dependencies:
  tools:
    - type: "mcp"
      value: "codegraph"
      description: "CodeGraph repository intelligence server"
policy:
  allow_implicit_invocation: true
