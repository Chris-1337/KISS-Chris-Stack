name: Tests
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    env:
      UV_PYTHON: '3.13'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --with pytest python -m pytest tests -q
