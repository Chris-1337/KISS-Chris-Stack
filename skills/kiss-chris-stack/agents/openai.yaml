interface:
  display_name: "KISS-Chris-Stack"
  short_description: "Route tasks and coordinate delegated stack work."
  default_prompt: "Use $kiss-chris-stack to route before setup: tiny direct fixes, clear stack goals, unclear grill-with-docs then goal, or large wayfinder with parallel unblocked tickets. Delegate all context collection to fresh gpt-6-luna low agents, substantive work to appropriate roles, preserve plan-mode approval and evaluation. Independent grill-with-docs and wayfinder default true; grill-me remains explicit."
dependencies:
