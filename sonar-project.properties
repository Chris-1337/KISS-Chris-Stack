sonar.projectKey=kiss-chris-stack
sonar.projectName=KISS-Chris-Stack
sonar.sources=scripts,skills/setup-sonarqube/scripts,hooks/stack.js,containers/remote
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13
sonar.python.coverage.reportPaths=.sonar-evidence/coverage.xml
sonar.javascript.lcov.reportPaths=.sonar-evidence/js/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Intentional root sshd: protects host keys and switches sessions to node.
# Root login is disabled; see docs/REMOTE-CONTAINER.md for the boundary.
# Apply only this rule to this Dockerfile; retain all other analysis.
sonar.issue.ignore.multicriteria=remoteSshd
sonar.issue.ignore.multicriteria.remoteSshd.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.remoteSshd.resourceKey=containers/remote/Dockerfile
